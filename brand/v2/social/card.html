<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business-Wrap social card</title>
<link rel="stylesheet" href="card.css">
<style>:root { --w: 1280px; --h: 640px; }</style>
</head>
<body>
<div class="card">
  <img class="lockup" src="../logo/lockup-en-dark.svg" alt="Business-Wrap">
  <h1>Evidence in.<br>A <span class="hl">bilingual</span> requirements document out.</h1>
  <p class="ar" dir="rtl">من الأدلة إلى وثيقة متطلبات بلغتين</p>
  <div class="chips"><span class="chip">PDF</span><span class="chip">DOCX</span><span class="chip">MCP server</span><span class="chip">Claude Code plugin</span></div>
  <div class="spread" aria-hidden="true">
    <div class="page en"><h2>Service card</h2><div class="ln m"></div><div class="ln"></div><span class="mark">Statuses</span><div class="ln s"></div><div class="ln m"></div><span class="tag">EN · LTR</span></div>
    <div class="page ar"><h2>بطاقة الخدمة</h2><div class="ln m"></div><div class="ln"></div><span class="mark">الحالات</span><div class="ln s"></div><div class="ln m"></div><span class="tag">عربي · RTL</span></div>
  </div>
</div>
</body>
</html>
