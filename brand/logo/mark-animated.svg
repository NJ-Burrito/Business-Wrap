<!-- Business-Wrap identity. Tool brand only: never placed in document outputs. Generated by brand/build.py. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Business-Wrap"><style>
.wrap,.line{stroke:var(--bw-ink,#003c7a)}.fold{stroke:var(--bw-accent,#9c7e36)}
@media (prefers-color-scheme:dark){.wrap,.line{stroke:var(--bw-ink,#fafaf9)}.fold{stroke:var(--bw-accent,#be9a41)}}
.wrap{stroke-dasharray:128;stroke-dashoffset:0}
.line{stroke-dasharray:25;stroke-dashoffset:0}
.fold{stroke-dasharray:27;stroke-dashoffset:0;transform-box:view-box;transform-origin:49px 8px;transition:transform 220ms cubic-bezier(.2,.8,.2,1)}
/* reveal (once): the wrap draws, the corner folds over out of the seam, the line is written. ~900 ms. */
@keyframes bw-wrap{from{stroke-dashoffset:128}to{stroke-dashoffset:0}}
@keyframes bw-fold{0%{stroke-dashoffset:27;transform:rotate(-24deg)}70%{stroke-dashoffset:0;transform:rotate(4deg)}100%{stroke-dashoffset:0;transform:rotate(0)}}
@keyframes bw-line{from{stroke-dashoffset:25}to{stroke-dashoffset:0}}
#reveal:target ~ .mark .wrap,.bw-reveal .wrap,svg:not(.bw-still) .mark .wrap{animation:bw-wrap 520ms cubic-bezier(.2,.8,.2,1) both}
#reveal:target ~ .mark .fold,.bw-reveal .fold,svg:not(.bw-still) .mark .fold{animation:bw-fold 300ms cubic-bezier(.2,.8,.2,1) 460ms both}
#reveal:target ~ .mark .line,.bw-reveal .line,svg:not(.bw-still) .mark .line{animation:bw-line 200ms cubic-bezier(.2,.8,.2,1) 700ms both}
/* hover / focus micro-motion: the corner lifts a little, like a page about to turn. */
svg:hover .fold,.bw-hover .fold,:focus-visible > svg .fold{transform:rotate(-9deg)}
@media (prefers-reduced-motion:reduce){.wrap,.fold,.line{animation:none!important;stroke-dashoffset:0!important;transform:none!important;transition:none!important}}
</style><g id="reveal"/><g class="mark"><g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path class="wrap" d="M35 8H22A7 7 0 0 0 15 15V49A7 7 0 0 0 22 56H42A7 7 0 0 0 49 49V22"/><path class="line" d="M24 32H40M24 43H32"/><path class="fold" d="M35 8V18A4 4 0 0 0 39 22H49"/></g></g></svg>
