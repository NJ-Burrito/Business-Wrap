<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=640" />
<title>Business-Wrap hero (9 s loop)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Thmanyah Serif Display";src:url("./assets/fonts/thmanyahserifdisplay-Bold.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Thmanyah Sans";src:url("./assets/fonts/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"Thmanyah Sans";src:url("./assets/fonts/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:block}
/* Business-Wrap v3 tokens used here (values from brand/v3/tokens-v3.css; generated by build_media.py) */
:root{--bw-accent:#be9a41;--bw-accent-rule:#9c7e36;--bw-band:#001e3d;--bw-bg:#fafaf9;--bw-ink:#1b1813;--bw-ink-muted:#544c3b;--bw-line:#e8e4de;--bw-line-strong:#968769;--bw-marker:#e3ddce;--bw-on-accent:#001e3d;--bw-primary:#003c7a;--bw-primary-soft:#e1eaf4;--bw-rule-strong:#d5cfc3;--bw-shadow-2:0 2px 4px rgba(27,24,19,.05), 0 10px 24px -6px rgba(0,30,61,.14);--bw-surface:#ffffff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}

#stage{position:relative;width:1280px;height:640px;overflow:hidden;background:var(--bw-bg);color:var(--bw-ink);font-family:"Thmanyah Sans",sans-serif}
.cap-t{position:absolute;left:0;right:0;top:46px;text-align:center;font-family:"Thmanyah Serif Display",serif;font-weight:700;font-size:44px;line-height:1.25;color:var(--bw-ink);white-space:nowrap}
.cap-t .ph{position:relative;display:inline-block}
.rl{position:absolute;left:0;right:0;bottom:-2px;height:4px;border-radius:2px;background:var(--bw-accent-rule)}
.cover{position:absolute;top:196px;width:200px;height:272px;border-radius:4px;background:var(--bw-surface);box-shadow:0 0 0 1px var(--bw-line),var(--bw-shadow-2);overflow:hidden}
#covEn{left:416px}#covAr{left:664px}
.cover .sp{position:absolute;top:0;bottom:0;width:26px;background:var(--bw-band)}
.cover .cp{position:absolute;top:0;width:26px;height:34px;background:var(--bw-accent)}
#covEn .sp,#covEn .cp{left:0}#covAr .sp,#covAr .cp{right:0}
.bar{position:absolute;height:9px;border-radius:2px;background:var(--bw-rule-strong)}
.bar.h{height:12px;background:var(--bw-primary)}
.bar.g{height:4px;background:var(--bw-accent-rule)}
.card{position:absolute;width:300px;border-radius:8px;background:var(--bw-surface);box-shadow:0 0 0 1px var(--bw-line),var(--bw-shadow-2);z-index:1}
#proc{top:186px;height:150px}#form{top:356px;height:196px}
.card .kick{position:absolute;top:16px;font-weight:500;font-size:16px;color:var(--bw-ink-muted)}
.node{position:absolute;top:62px;width:72px;height:46px;border-radius:4px;border:2px solid var(--bw-line-strong);background:var(--bw-surface)}
.node.go{width:96px;border-color:var(--bw-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--bw-ink)}
.node.go span{position:relative}
.arw{position:absolute;top:84px;height:2px;width:22px;background:var(--bw-line-strong)}
.fld{position:absolute;height:34px;border-radius:4px;border:2px solid var(--bw-line-strong);background:var(--bw-surface)}
.lab{position:absolute;font-weight:700;font-size:17px;color:var(--bw-ink)}
.lab span{position:relative}
.page{position:absolute;top:168px;width:300px;height:404px;background:var(--bw-surface);box-shadow:0 0 0 1px var(--bw-line),var(--bw-shadow-2);z-index:2}
#pgEn{left:340px;border-radius:4px 0 0 4px}#pgAr{left:640px;border-radius:0 4px 4px 0}
.row{position:absolute;left:28px;right:28px;height:40px;border-top:1px solid var(--bw-line)}
.row.hd{background:var(--bw-primary-soft);border-top:0}
.row .lab{top:9px;font-size:16px}
#spine{position:absolute;left:631px;top:168px;width:18px;height:404px;background:var(--bw-band);z-index:3}
#spCap{position:absolute;left:631px;top:168px;width:18px;height:40px;background:var(--bw-accent);z-index:4}
.stamp{position:absolute;top:478px;width:108px;height:50px;border-radius:2px;background:var(--bw-accent);color:var(--bw-on-accent);font-weight:700;font-size:24px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;box-shadow:var(--bw-shadow-2);z-index:5}
#stPdf{left:486px}#stDocx{left:686px}
#sweep{position:absolute;top:150px;left:0;width:240px;height:440px;background:linear-gradient(90deg,transparent,var(--bw-marker),transparent);mix-blend-mode:multiply;z-index:6}

</style>
</head>
<body>
<div id="stage" data-composition-id="bw-hero" data-start="0" data-duration="9" data-fps="25" data-width="1280" data-height="640">
  <div class="cap-t" id="c0"><span>Evidence in. One document, </span><span class="ph">two languages<i class="rl" id="rl0"></i></span><span>.</span></div>
  <div class="cap-t" id="c1">Start from the evidence.</div>
  <div class="cap-t" id="c2">One document. Both editions.</div>
  <div class="cap-t" id="c3">Real text. Fonts embedded.</div>
  <div class="cap-t" id="c4">Edit the page that prints.</div>
  <div class="card" data-layout-allow-overflow id="proc" style="left:64px">
    <div class="node" style="left:16px"></div><i class="arw" style="left:88px"></i>
    <div class="node go" style="left:110px"><span>Approve<i class="rl" id="rlA" style="bottom:-6px"></i></span></div>
    <i class="arw" style="left:206px"></i><div class="node" style="left:228px"></div>
    <i class="bar" style="left:16px;top:124px;width:150px"></i>
  </div>
  <div class="card" data-layout-allow-overflow id="form" style="left:64px">
    <div class="kick" style="left:18px">live e-service</div>
    <i class="bar" style="left:18px;top:54px;width:80px"></i><div class="fld" style="left:18px;top:70px;width:264px"></div>
    <b class="lab" style="left:18px;top:116px"><span>Status<i class="rl" id="rlS" style="bottom:-4px"></i></span></b>
    <div class="fld" style="left:18px;top:146px;width:170px"></div>
  </div>
  <div class="cover" id="covEn"><i class="sp"></i><i class="cp"></i><i class="bar h" style="left:46px;top:60px;width:110px"></i><i class="bar" style="left:46px;top:92px;width:128px"></i><i class="bar" style="left:46px;top:110px;width:96px"></i><i class="bar g" style="left:46px;top:140px;width:52px"></i></div><div class="cover" id="covAr"><i class="sp"></i><i class="cp"></i><i class="bar h" style="right:46px;top:60px;width:110px"></i><i class="bar" style="right:46px;top:92px;width:128px"></i><i class="bar" style="right:46px;top:110px;width:96px"></i><i class="bar g" style="right:46px;top:140px;width:52px"></i></div>
  <div class="page" id="pgEn"><i class="bar h" style="left:28px;top:34px;width:150px"></i><i class="bar" style="left:28px;top:66px;width:230px"></i><i class="bar" style="left:28px;top:84px;width:190px"></i><div class="row hd" style="top:120px"><i class="bar" style="left:14px;top:15px;width:70px"></i><i class="bar" style="left:140px;top:15px;width:60px"></i></div><div class="row" style="top:160px"><i class="bar" style="left:14px;top:15px;width:90px"></i><i class="bar" style="left:140px;top:15px;width:80px"></i></div><div class="row" style="top:200px"><b class="lab" style="left:14px;top:8px" dir="ltr"><span>Statuses<i class="rl" id="rlEn"></i></span></b><i class="bar" style="left:140px;top:15px;width:70px"></i></div><div class="row" style="top:240px"><i class="bar" style="left:14px;top:15px;width:80px"></i><i class="bar" style="left:140px;top:15px;width:90px"></i></div><i class="bar" style="left:28px;top:306px;width:236px"></i><i class="bar" style="left:28px;top:324px;width:200px"></i><i class="bar" style="left:28px;top:342px;width:160px"></i></div><div class="page" id="pgAr"><i class="bar h" style="right:28px;top:34px;width:150px"></i><i class="bar" style="right:28px;top:66px;width:230px"></i><i class="bar" style="right:28px;top:84px;width:190px"></i><div class="row hd" style="top:120px"><i class="bar" style="right:14px;top:15px;width:70px"></i><i class="bar" style="right:140px;top:15px;width:60px"></i></div><div class="row" style="top:160px"><i class="bar" style="right:14px;top:15px;width:90px"></i><i class="bar" style="right:140px;top:15px;width:80px"></i></div><div class="row" style="top:200px"><b class="lab" style="right:14px;top:8px" dir="rtl"><span>الحالات<i class="rl" id="rlAr"></i></span></b><i class="bar" style="right:140px;top:15px;width:70px"></i></div><div class="row" style="top:240px"><i class="bar" style="right:14px;top:15px;width:80px"></i><i class="bar" style="right:140px;top:15px;width:90px"></i></div><i class="bar" style="right:28px;top:306px;width:236px"></i><i class="bar" style="right:28px;top:324px;width:200px"></i><i class="bar" style="right:28px;top:342px;width:160px"></i></div>
  <div id="spine"></div><div id="spCap"></div>
  <div class="stamp" id="stPdf">PDF</div><div class="stamp" id="stDocx">DOCX</div>
  <div id="sweep"></div>
</div>
<script>
(() => {
  const ID = "bw-hero", D = 9;
  const tl = gsap.timeline({ paused: true });
  const S = 1, oS = "0% 50%", oE = "100% 50%";
  const swap = (from, to, t) => {
    tl.to(from, { opacity: 0, y: -8, duration: 0.16, ease: "power2.in" }, t);
    tl.fromTo(to, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.24, ease: "expo.out" }, t + 0.16);
  };
  // frame 0 (= last frame): the two covers closed, the hook with The Rule under its phrase
  gsap.set(["#c1", "#c2", "#c3", "#c4"], { opacity: 0 });
  gsap.set("#rl0", { scaleX: 1, transformOrigin: oS });
  gsap.set(["#rlA", "#rlS", "#rlEn"], { scaleX: 0, transformOrigin: "0% 50%" });
  gsap.set("#rlAr", { scaleX: 0, transformOrigin: "100% 50%" });
  if (S < 0) gsap.set(["#rlA", "#rlS"], { transformOrigin: "100% 50%" });
  gsap.set(["#proc", "#form"], { x: -380 * S, opacity: 0 });
  gsap.set(["#pgEn", "#pgAr"], { scaleX: 0, opacity: 0 });
  gsap.set("#pgEn", { transformOrigin: "100% 50%" });
  gsap.set("#pgAr", { transformOrigin: "0% 50%" });
  gsap.set("#spine", { scaleY: 0, transformOrigin: "50% 0%" });
  gsap.set("#spCap", { y: -12, opacity: 0 });
  gsap.set(["#stPdf", "#stDocx"], { y: -36, scale: 1.12, opacity: 0 });
  gsap.set("#sweep", { x: 160, opacity: 0 });
  // 1.2 to 2.6 evidence: two cards slide in from the reading start; The Rule marks Approve and Status
  swap("#c0", "#c1", 1.2);
  tl.to("#proc", { x: 0, opacity: 1, duration: 0.52, ease: "expo.out" }, 1.3);
  tl.to("#form", { x: 0, opacity: 1, duration: 0.52, ease: "expo.out" }, 1.42);
  tl.to("#rlA", { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.85);
  tl.to("#rlS", { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 2.0);
  // 2.6 to 4.0 bind: the cards slide under the spine, The Spine grows, the covers open into a spread
  swap("#c1", "#c2", 2.6);
  tl.to(["#proc", "#form"], { x: (S > 0 ? 440 : -440), scale: 0.5, opacity: 0, duration: 0.52, ease: "power2.in", stagger: 0.04 }, 2.62);
  tl.to("#covEn", { x: 60, opacity: 0, duration: 0.36, ease: "power2.in" }, 3.0);
  tl.to("#covAr", { x: -60, opacity: 0, duration: 0.36, ease: "power2.in" }, 3.0);
  tl.to("#spine", { scaleY: 1, duration: 0.52, ease: "power3.inOut" }, 2.95);
  tl.to("#spCap", { y: 0, opacity: 1, duration: 0.16, ease: "back.out(1.4)" }, 3.47);
  tl.to(["#pgEn", "#pgAr"], { scaleX: 1, opacity: 1, duration: 0.52, ease: "expo.out" }, 3.2);
  // 4.0 to 5.6 proof: the same row gets The Rule in both pages at once (EN from the left, AR from the right)
  tl.to(["#rlEn", "#rlAr"], { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 4.1);
  // 5.6 to 6.4 hit: two gold stamps drop (spring)
  swap("#c2", "#c3", 5.44);
  tl.to("#stPdf", { y: 0, scale: 1, opacity: 1, rotation: -4, duration: 0.16, ease: "back.out(1.4)" }, 5.6);
  tl.to("#stDocx", { y: 0, scale: 1, opacity: 1, rotation: 3, duration: 0.16, ease: "back.out(1.4)" }, 5.76);
  // 6.4 to 8.2 hold and breathe: a soft light passes over the paper
  swap("#c3", "#c4", 6.4);
  tl.to("#sweep", { opacity: 0.55, duration: 0.5, ease: "sine.inOut" }, 6.6);
  tl.to("#sweep", { x: 880, duration: 1.4, ease: "sine.inOut" }, 6.6);
  tl.to("#sweep", { opacity: 0, duration: 0.5, ease: "sine.inOut" }, 7.5);
  // 8.2 to 9.0 release: the spread closes back into the two covers of frame 0
  tl.to(["#stPdf", "#stDocx"], { y: -20, opacity: 0, duration: 0.16, ease: "power2.in" }, 8.2);
  tl.to(["#rlEn", "#rlAr"], { opacity: 0, duration: 0.16 }, 8.2);
  tl.to(["#pgEn", "#pgAr"], { scaleX: 0, opacity: 0, duration: 0.36, ease: "power2.in" }, 8.3);
  tl.to("#spCap", { y: -12, opacity: 0, duration: 0.16, ease: "power2.in" }, 8.3);
  tl.to("#spine", { scaleY: 0, duration: 0.36, ease: "power2.in" }, 8.34);
  tl.to(["#covEn", "#covAr"], { x: 0, opacity: 1, duration: 0.36, ease: "expo.out" }, 8.4);
  tl.to("#c4", { opacity: 0, y: -8, duration: 0.16, ease: "power2.in" }, 8.2);
  tl.set("#rl0", { scaleX: 0 }, 8.36);
  tl.fromTo("#c0", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.24, ease: "expo.out", immediateRender: false }, 8.36);
  tl.to("#rl0", { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 8.4);
  // settle: the state from 8.8 to 9.0 equals frame 0
  tl.set(["#rlEn", "#rlAr"], { scaleX: 0, opacity: 1 }, 8.8);
  tl.set(["#rlA", "#rlS"], { scaleX: 0 }, 8.8);
  tl.set(["#proc", "#form"], { x: -380 * S, scale: 1, opacity: 0 }, 8.8);
  tl.set(["#stPdf", "#stDocx"], { y: -36, scale: 1.12, rotation: 0, opacity: 0 }, 8.8);
  tl.set("#sweep", { x: 160, opacity: 0 }, 8.8);
  tl.set({}, {}, D);
  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
</body>
</html>
