<script>
(() => {
  const ID = "bw-gh-banner", D = 6;
  const tl = gsap.timeline({ paused: true });
  // frame 0 (= last frame): navy band ground, the mark's blank cover; 0 to 1.6 s the mark builds (c.3 order)
  gsap.set("#mark .spine", { scaleY: 0, transformOrigin: "50% 0%" });
  gsap.set("#mark .cap", { y: -6, opacity: 0 });
  gsap.set("#mark .ln", { strokeDasharray: "1 3", strokeDashoffset: 1.05 });
  gsap.set("#mark .l2", { strokeDashoffset: -1.05 });
  gsap.set("#mark .rule", { scaleX: 0, transformOrigin: "0% 50%" });
  gsap.set("#wm", { y: 24, opacity: 0 });
  gsap.set("#wm .rule", { scaleX: 0, transformOrigin: "0% 50%" });
  gsap.set(".ic", { y: 16, opacity: 0 });
  gsap.set(".ic .hl", { scale: 0.4, opacity: 0, transformOrigin: "50% 50%" });
  gsap.set('.ic path[stroke-width="1.4"], .ic ellipse', { stroke: "#fafaf9" });
  tl.to("#mark .spine", { scaleY: 1, duration: 0.78, ease: "power3.inOut" }, 0.12);
  tl.to("#mark .cap", { y: 0, opacity: 1, duration: 0.24, ease: "back.out(1.4)" }, 0.66);
  tl.to("#mark .l1", { strokeDashoffset: 0, duration: 0.54, ease: "expo.out" }, 0.78);
  tl.to("#mark .l2", { strokeDashoffset: 0, duration: 0.54, ease: "expo.out" }, 0.9);
  tl.to("#mark .rule", { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.0);
  // 1.6 to 3.0: the wordmark rises, The Rule draws under Wrap; the tool row arrives
  tl.to("#wm", { y: 0, opacity: 1, duration: 0.52, ease: "expo.out" }, 1.6);
  tl.to("#wm .rule", { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 1.9);
  tl.to(".ic", { y: 0, opacity: 1, duration: 0.36, ease: "expo.out", stagger: 0.04 }, 2.3);
  // 3.0 to 5.2: each icon's gold part pops in turn (stagger 4 f); PDF and DOCX letters turn navy on the gold
  gsap.utils.toArray(".ic").forEach((ic, i) => {
    const t = 3.0 + i * 0.16;
    tl.to(ic.querySelectorAll(".hl"), { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(1.4)" }, t);
    tl.fromTo(ic, { y: 0 }, { y: -6, duration: 0.16, ease: "expo.out", immediateRender: false }, t);
    tl.to(ic, { y: 0, duration: 0.36, ease: "power3.inOut" }, t + 0.16);
    const letters = ic.querySelectorAll('path[stroke-width="1.4"], ellipse');
    if (letters.length) tl.to(letters, { stroke: "#001e3d", duration: 0.16 }, t);
  });
  // 5.2 to 6.0: icons and wordmark fade, the mark returns to its blank cover (frame 0)
  tl.to(".ic", { opacity: 0, duration: 0.36, ease: "power2.in", stagger: 0.02 }, 5.2);
  tl.to("#wm", { opacity: 0, duration: 0.36, ease: "power2.in" }, 5.26);
  tl.to(["#mark .ln", "#mark .rule", "#mark .cap"], { opacity: 0, duration: 0.24, ease: "power2.in" }, 5.4);
  tl.to("#mark .spine", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.36, ease: "power2.in" }, 5.46);
  tl.set("#mark .ln", { strokeDashoffset: 1.05, opacity: 1 }, 5.86);

  tl.set("#mark .cap", { y: -6, opacity: 0 }, 5.86);

  tl.set({}, {}, D);
  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
