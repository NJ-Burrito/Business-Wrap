<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=512, height=512" />
<title>Business-Wrap logo loop (5 s)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>

/* Business-Wrap v3 tokens used here (values from brand/v3/tokens-v3.css; generated by build_media.py) */
:root{--bw-accent:#be9a41;--bw-band:#001e3d;--bw-primary-hover:#002d5c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px;overflow:hidden}

#stage{position:relative;width:512px;height:512px;overflow:hidden;background:var(--bw-band)}
#pool{position:absolute;left:-144px;top:-144px;width:800px;height:800px;border-radius:50%;background:radial-gradient(closest-side,var(--bw-primary-hover),var(--bw-band))}
#glow{position:absolute;left:96px;top:96px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,var(--bw-accent),transparent);opacity:0}
#markw{position:absolute;left:96px;top:96px;width:320px;height:320px}
#mark{overflow:visible}

</style>
</head>
<body>
<div id="stage" data-composition-id="bw-logo-loop" data-start="0" data-duration="5" data-fps="25" data-width="512" data-height="512">
  <div id="pool"></div><div id="glow"></div>
  <div id="markw"><svg id="mark" width="320" height="320" xmlns="http://www.w3.org/2000/svg" class="bw-logo" viewBox="0 0 64 64" role="img" aria-label="Business-Wrap"><path class="sheet" d="M18 6H50Q54 6 54 10V54Q54 58 50 58H18Q14 58 14 54V10Q14 6 18 6Z" fill="#fafaf9" stroke="#fafaf9" stroke-width="2.5"/><path class="spine" d="M18 6H26V58H18Q14 58 14 54V10Q14 6 18 6Z" fill="#001e3d"/><path class="cap" d="M18 6H26V14H14V10Q14 6 18 6Z" fill="#be9a41"/><path class="ln l1" pathLength="1" d="M31 22H48" stroke="#1b1813" stroke-width="3" stroke-linecap="round"/><path class="ln l2" pathLength="1" d="M38 30H48" stroke="#1b1813" stroke-width="3" stroke-linecap="round"/><path class="rule" d="M31 41H41" stroke="#be9a41" stroke-width="3" stroke-linecap="round"/></svg>
</div>
</div>
<script>
(() => {
  const ID = "bw-logo-loop", D = 5;
  const tl = gsap.timeline({ paused: true });
  // frame 0 (= last frame): the blank cover; the mark builds in the c.3 order at x1.5, holds, and unbuilds
  gsap.set("#mark .spine", { scaleY: 0, transformOrigin: "50% 0%" });
  gsap.set("#mark .cap", { y: -6, opacity: 0 });
  gsap.set("#mark .ln", { strokeDasharray: "1 3", strokeDashoffset: 1.05 });
  gsap.set("#mark .l2", { strokeDashoffset: -1.05 });
  gsap.set("#mark .rule", { scaleX: 0, transformOrigin: "0% 50%" });
  tl.to("#mark .spine", { scaleY: 1, duration: 0.78, ease: "power3.inOut" }, 0.2);
  tl.to("#mark .cap", { y: 0, opacity: 1, duration: 0.24, ease: "back.out(1.4)" }, 0.86);
  tl.to("#mark .l1", { strokeDashoffset: 0, duration: 0.54, ease: "expo.out" }, 0.98);
  tl.to("#mark .l2", { strokeDashoffset: 0, duration: 0.54, ease: "expo.out" }, 1.1);
  tl.to("#mark .rule", { scaleX: 1, duration: 1.35, ease: "power3.inOut" }, 1.34);
  tl.to("#glow", { opacity: 0.16, duration: 0.6, ease: "sine.inOut" }, 2.2);
  tl.to("#glow", { opacity: 0, duration: 0.8, ease: "sine.inOut" }, 3.0);
  tl.to("#mark .rule", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.36, ease: "power2.in" }, 3.7);
  tl.to("#mark .l2", { strokeDashoffset: 1.05, duration: 0.24, ease: "power2.in" }, 3.86);
  tl.to("#mark .l1", { strokeDashoffset: -1.05, duration: 0.24, ease: "power2.in" }, 3.92);
  tl.to("#mark .cap", { y: -6, opacity: 0, duration: 0.16, ease: "power2.in" }, 4.1);
  tl.to("#mark .spine", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.52, ease: "power3.inOut" }, 4.12);
  tl.set("#mark .ln", { strokeDashoffset: 1.05 }, 4.7);
  tl.set("#mark .l2", { strokeDashoffset: -1.05 }, 4.7);
  tl.set("#mark .rule", { transformOrigin: "0% 50%" }, 4.7);
  tl.set("#mark .spine", { transformOrigin: "50% 0%" }, 4.7);
  tl.set({}, {}, D);
  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
</body>
</html>
