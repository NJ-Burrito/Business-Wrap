name: gates

# Four jobs run in parallel: security, checks, and the test suites split into 4 shards
# (node tests/run.mjs --shard i/4, balanced by tests/durations.json). The last job, "gates",
# is the single aggregate check: it keeps the old check name and is green only when all of them are.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the security gate scans the whole history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          V=8.30.1
          curl -sSLo gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLo gl.sum "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" gl.sum | sed 's/gitleaks_.*$/gl.tgz/' | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf gl.tgz -C "$HOME/.local/bin" gitleaks && rm gl.tgz gl.sum
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gitleaks (full history, repo config)
        run: gitleaks git --config security/gitleaks.toml --redact --no-banner --log-opts="--all" .

      - name: Security gate (tree + history + commit messages)
        env:
          PYTHONUTF8: "1"
        run: python security/check.py

      - name: Security gate self-test
        env:
          PYTHONUTF8: "1"
        run: python security/check.py --selftest

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the history gate reads old tags and fixtures

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: One version everywhere (package, plugin, marketplace, MCP registry, Smithery, READMEs, CHANGELOG)
        run: node update/version-sync.mjs

      - name: Palette contrast + theme build
        env:
          PYTHONUTF8: "1"
        run: python design/build.py

      - name: Brand v3 tokens contrast, light (editor chrome and site, toolbar glass pairs included)
        env:
          PYTHONUTF8: "1"
        run: python palette/check.py brand/v3/tokens-v3.json

      - name: Brand v3 tokens contrast, dark
        env:
          PYTHONUTF8: "1"
        run: python palette/check.py brand/v3/dark/tokens-v3.dark.json

      - name: Install
        run: npm ci

      - name: History gate (a version bump needs its fixture; old saved files must open whole)
        run: node tools/release/history-gate.mjs

      - name: Skill HTML is current (the first half of npm test)
        run: node engine/build-skill-html.mjs --check

  tests:
    name: tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # a failure in one shard must not hide the others' results
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm # keyed on package-lock.json; no Playwright download step exists (tests use the runner's own browsers)

      - name: Install
        run: npm ci

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Test tools (poppler, an Arabic-capable fallback face, Python libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-core
          uv pip install --system pymupdf python-docx lxml jsonschema

      - name: Editor engine tests, shard ${{ matrix.shard }}/4
        env:
          PYTHONUTF8: "1"
          CI: "true"
        run: node tests/run.mjs --shard ${{ matrix.shard }}/4

      - name: Suite times (feed them to node tests/run.mjs --merge to refresh durations.json)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-times-${{ matrix.shard }}
          path: out/suite-times.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep test outputs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-outputs-${{ matrix.shard }}
          # everything the run wrote (PDF, DOCX, HTML, editors, harvests, screenshots, results, axe report)
          path: out/
          if-no-files-found: warn
          retention-days: 7

  gates:
    # The required-check name. One job that is green only when every part is.
    if: always()
    needs: [security, checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All parts passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "security/checks/tests results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || { echo "a gate part did not succeed"; exit 1; }; done
