# Smithery metadata for the Business-Wrap MCP server (stdio, local only). It runs from the repository itself
# (node mcp/cli.mjs in a clone, or the installed Claude Code plugin folder); there is no npm package to fetch.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      fontDir:
        type: string
        description: "Optional. Folder with your own TrueType font cuts (sets BW_FONT_DIR); the bundled Thmanyah fallback is used when no other copy is found."
    required: []
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["mcp/cli.mjs"],
      env: config.fontDir ? { BW_FONT_DIR: config.fontDir } : {}
    })
