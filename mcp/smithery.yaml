# Smithery metadata for the Business-Wrap MCP server (stdio, local only).
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      fontDir:
        type: string
        description: "Optional. Folder with your own TrueType font cuts (sets BW_FONT_DIR); the bundled Thmanyah fallback is used when no other copy is found."
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "-p", "business-wrap@0.13.0", "business-wrap-mcp"],
      env: config.fontDir ? { BW_FONT_DIR: config.fontDir } : {}
    })
