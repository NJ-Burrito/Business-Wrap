# Smithery metadata for the Business-Wrap MCP server (stdio, local only).
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      fontDir:
        type: string
        description: Folder holding the TrueType font cuts.
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "-p", "business-wrap@0.8.2", "business-wrap-mcp"],
      env: config.fontDir ? { BW_FONT_DIR: config.fontDir } : {}
    })
